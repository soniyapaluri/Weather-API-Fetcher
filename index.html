<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyPulse Weather App</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h1>🌤 SkyPulse Weather App</h1>

    <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button onclick="getWeather()">Search</button>
    </div>

    <div id="weatherCard" class="weather-card">
        <h2 id="city"></h2>
        <div id="emoji" class="emoji">☀️</div>

        <h3 id="temp"></h3>
        <p id="condition"></p>

        <div class="stats">
            <div class="stat-card">
                <h4>Humidity</h4>
                <p id="humidity"></p>
            </div>

            <div class="stat-card">
                <h4>Wind</h4>
                <p id="wind"></p>
            </div>

            <div class="stat-card">
                <h4>Feels Like</h4>
                <p id="feels"></p>
            </div>

            <div class="stat-card">
                <h4>UV Index</h4>
                <p id="uv"></p>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
